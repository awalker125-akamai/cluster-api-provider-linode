apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: cluster-api-provider-linode
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: cluster-api-provider-linode
    control-plane: controller-manager
  name: capl-controller-manager
  namespace: capl-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        command:
        - /manager
        env:
        - name: LINODE_TOKEN
          valueFrom:
            secretKeyRef:
              key: apiToken
              name: capl-manager-credentials
        - name: LINODE_DNS_TOKEN
          valueFrom:
            secretKeyRef:
              key: dnsToken
              name: capl-manager-credentials
        - name: LINODE_URL
          valueFrom:
            secretKeyRef:
              key: LINODE_URL
              name: capl-manager-credentials
        - name: LINODE_API_VERSION
          value: v4beta
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SSL_CERT_DIR
          value: /tls
