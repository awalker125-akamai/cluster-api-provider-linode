apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../default
  - rdmaVPC.yaml

patches:
  # Switch workers to RDMA machine type with linode interface generation.
  # References the RDMA VPC created by rdmaVPC.yaml via vpcRef + subnetNames.
  # RDMA_MACHINE_TYPE defaults to g3-gpu-rtxpro6000-blackwell-rdma-8
  # RDMA_SUBNET_CIDR must be set — subnet CIDR within the RDMA VPC (e.g. 192.168.0.0/24)
  # RDMA_SUBNET_LABEL defaults to gpu-0
  - target:
      group: infrastructure.cluster.x-k8s.io
      version: v1alpha2
      kind: LinodeMachineTemplate
      name: ".*\\}$"
    patch: |-
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: LinodeMachineTemplate
      metadata:
        name: ${CLUSTER_NAME}
      spec:
        template:
          spec:
            type: ${RDMA_MACHINE_TYPE:=g3-gpu-rtxpro6000-blackwell-rdma-8}
            interfaceGeneration: linode
            rdmaVPC:
              vpcRef:
                apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
                kind: LinodeVPC
                name: ${CLUSTER_NAME}-rdma
              subnetNames:
                - ${RDMA_SUBNET_LABEL:=gpu-0}
  # Remove legacy interfaces — incompatible with rdmaVPC + interfaceGeneration=linode
  - target:
      group: infrastructure.cluster.x-k8s.io
      version: v1alpha2
      kind: LinodeMachineTemplate
      name: ".*\\}$"
    patch: |-
      - op: remove
        path: /spec/template/spec/interfaces
  # Enable VPC-scoped NodeBalancer backends
  # NB_BACKEND_IPV4_RANGE must be set to the VPC subnet CIDR used for NodeBalancer backends
  - target:
      group: infrastructure.cluster.x-k8s.io
      version: v1alpha2
      kind: LinodeCluster
    patch: |-
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: LinodeCluster
      metadata:
        name: ${CLUSTER_NAME}
      spec:
        network:
          enableVPCBackends: true
          nodeBalancerBackendIPv4Range: ${NB_BACKEND_IPV4_RANGE}
  # Set cni.exclusive=false so other CNIs can coexist alongside Cilium
  - target:
      group: addons.cluster.x-k8s.io
      version: v1alpha1
      kind: HelmChartProxy
      name: ".*-cilium"
    patch: |-
      - op: replace
        path: /spec/valuesTemplate
        value: |
          bgpControlPlane:
            enabled: true
          cni:
            exclusive: false
          routingMode: native
          nodePort:
            directRoutingDevice: eth+
          kubeProxyReplacement: true
          ipv4NativeRoutingCIDR: ${VPC_NETWORK_CIDR:=10.0.0.0/8}
          tunnelProtocol: ""
          enableIPv4Masquerade: true
          policyAuditMode: ${FW_AUDIT_ONLY:=true}
          hostFirewall:
            enabled: true
          extraConfig:
            allow-localhost: policy
          k8sServiceHost: {{ .InfraCluster.spec.controlPlaneEndpoint.host }}
          k8sServicePort: {{ .InfraCluster.spec.controlPlaneEndpoint.port }}
          extraArgs:
          - --nodeport-addresses=0.0.0.0/0
          ipam:
            mode: kubernetes
          ipv4:
            enabled: true
          ipv6:
            enabled: false
          k8s:
            requireIPv4PodCIDR: true
          hubble:
            relay:
              enabled: true
            ui:
              enabled: true
